name: hermes-3 + VANTAGE Tests
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'  # This will trigger for PRs against any branch

defaults:
  run:
    shell: bash

jobs:
  docker_spack_install_tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ukaea-edge-code/hermes-3:edge
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    permissions:
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Inspect repo
        run: ls
      - name : hello world
        run: echo "Hello world"